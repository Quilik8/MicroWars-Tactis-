[package]
name = "microwars"
version = "0.1.0"
description = "MicroWars prototype desktop build"
authors = ["Quilik"]
edition = "2021"

[lib]
name = "microwars_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "microwars"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
